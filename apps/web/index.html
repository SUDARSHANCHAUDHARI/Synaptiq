<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synaptiq Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: rgba(255,255,255,0.95);
      --line: rgba(15,23,42,0.08);
      --text: #0f172a;
      --muted: #667085;
      --shadow: 0 24px 54px rgba(15,23,42,0.1);
      --blue: #2563eb;
      --green: #15803d;
      --amber: #d97706;
      --red: #c2410c;
      --loop: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Display","Segoe UI",sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 34%),
        radial-gradient(circle at bottom right, rgba(15,118,110,0.1), transparent 28%),
        var(--bg);
    }
    .shell { max-width: 1380px; margin: 0 auto; padding: 28px 18px 40px; }
    .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-bottom: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .hero-main, .hero-side, .runs-panel { padding: 22px; }
    .eyebrow {
      display: inline-flex; padding: 8px 12px; border-radius: 999px;
      background: rgba(15,23,42,0.06); font-size: 12px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    h1 { margin: 14px 0 10px; font-size: clamp(2.4rem,4vw,4.2rem); line-height: 0.95; letter-spacing: -0.06em; }
    p { color: var(--muted); line-height: 1.65; }
    textarea {
      width: 100%; min-height: 120px; resize: vertical; border-radius: 18px; border: 1px solid var(--line);
      padding: 16px; font: inherit; outline: none; background: white;
    }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 14px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer;
      color: white; background: linear-gradient(135deg,#111827,#2563eb);
      box-shadow: 0 14px 26px rgba(37,99,235,0.22);
    }
    button.secondary { background: white; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
    .status { min-height: 20px; margin-top: 12px; color: var(--muted); font-size: 0.92rem; }
    .summary-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .metric { border: 1px solid var(--line); border-radius: 20px; padding: 18px; background: white; }
    .metric-label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .metric-value { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.04em; }
    .runs-panel { padding: 22px; }
    .panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .panel-title h2 { margin: 0; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .runs { display: grid; gap: 12px; }
    .run-card {
      display: block; text-decoration: none; color: inherit; background: white; border: 1px solid var(--line);
      border-radius: 22px; padding: 16px; transition: transform .18s ease,border-color .18s ease;
    }
    .run-card:hover { transform: translateY(-1px); border-color: rgba(37,99,235,0.28); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .run-title { margin: 10px 0 12px; font-size: 1rem; font-weight: 700; line-height: 1.45; }
    .run-meta { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; color: var(--muted); font-size: 0.88rem; }
    .badge {
      display: inline-flex; padding: 6px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .done { background: rgba(34,197,94,0.12); color: var(--green); }
    .queued, .running { background: rgba(37,99,235,0.12); color: var(--blue); }
    .retry { background: rgba(217,119,6,0.12); color: var(--amber); }
    .failed { background: rgba(194,65,12,0.12); color: var(--red); }
    .loop_detected { background: rgba(124,58,237,0.12); color: var(--loop); }
    .loading, .empty {
      padding: 24px; border-radius: 22px; border: 1px dashed rgba(15,23,42,0.14); background: rgba(255,255,255,0.55); color: var(--muted);
    }
    @media (max-width: 980px) {
      .hero { grid-template-columns: 1fr; }
      .run-meta { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 640px) {
      .summary-grid, .run-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="panel hero-main">
        <span class="eyebrow">Dashboard</span>
        <h1>Track every run.</h1>
        <p>Queue new work, monitor cost and status, and jump into a Linear-style timeline for each run.</p>
        <textarea id="task" placeholder="Describe the task to send through the agent pipeline.">build todo app</textarea>
        <div class="actions">
          <button id="submit">Queue Run</button>
          <button class="secondary" id="refresh">Refresh</button>
        </div>
        <div class="status" id="status">Ready.</div>
      </div>

      <div class="panel hero-side">
        <div class="summary-grid">
          <div class="metric"><div class="metric-label">Runs</div><div class="metric-value" id="metricRuns">0</div></div>
          <div class="metric"><div class="metric-label">Total Cost</div><div class="metric-value" id="metricCost">$0.0000</div></div>
          <div class="metric"><div class="metric-label">Queued</div><div class="metric-value" id="metricQueued">0</div></div>
          <div class="metric"><div class="metric-label">Failed</div><div class="metric-value" id="metricFailed">0</div></div>
        </div>
      </div>
    </section>

    <section class="panel runs-panel">
      <div class="panel-title">
        <h2>All Runs</h2>
        <span id="runCountLabel">Loading...</span>
      </div>
      <div id="runs" class="loading">Loading runs…</div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const runsEl = document.getElementById("runs");
    const taskEl = document.getElementById("task");
    const runCountLabelEl = document.getElementById("runCountLabel");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "var(--red)" : "var(--muted)";
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 4,
        maximumFractionDigits: 6
      }).format(Number(value || 0));
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderSummary(runs) {
      const totalCost = runs.reduce((sum, run) => sum + Number(run.total_cost || 0), 0);
      document.getElementById("metricRuns").textContent = runs.length;
      document.getElementById("metricCost").textContent = formatCurrency(totalCost);
      document.getElementById("metricQueued").textContent = runs.filter((run) => ["queued", "running"].includes(run.status)).length;
      document.getElementById("metricFailed").textContent = runs.filter((run) => run.status === "failed").length;
    }

    function renderRuns(runs) {
      runCountLabelEl.textContent = `${runs.length} total`;
      renderSummary(runs);

      if (!runs.length) {
        runsEl.className = "empty";
        runsEl.textContent = "No runs yet.";
        return;
      }

      runsEl.className = "runs";
      runsEl.innerHTML = runs.map((run) => `
        <a class="run-card" href="/runs/view/${run.id}">
          <div class="row">
            <strong>#${run.id}</strong>
            <span class="badge ${run.status}">${run.status}</span>
          </div>
          <div class="run-title">${escapeHtml(run.input)}</div>
          <div class="run-meta">
            <span>Cost: ${formatCurrency(run.total_cost)}</span>
            <span>Retries: ${run.retry_count}</span>
            <span>Created: ${new Date(run.created_at).toLocaleString()}</span>
            <span>Failed: ${run.failed_step_count}</span>
          </div>
        </a>
      `).join("");
    }

    async function fetchRuns() {
      try {
        const res = await fetch("/runs");
        const data = await res.json();
        renderRuns(data);
      } catch (error) {
        runsEl.className = "empty";
        runsEl.textContent = error.message || "Failed to load runs.";
        setStatus(error.message || "Failed to fetch runs", true);
      }
    }

    async function submitRun() {
      const task = taskEl.value.trim();
      if (!task) {
        setStatus("Task is required.", true);
        return;
      }

      setStatus("Queueing run...");
      try {
        const res = await fetch("/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Failed to queue run");
        }
        setStatus(`Queued run #${data.runId}.`);
        fetchRuns();
      } catch (error) {
        setStatus(error.message || "Failed to queue run", true);
      }
    }

    document.getElementById("submit").addEventListener("click", submitRun);
    document.getElementById("refresh").addEventListener("click", fetchRuns);
    fetchRuns();
    setInterval(fetchRuns, 5000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synaptiq Run Detail</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: rgba(255,255,255,0.95);
      --line: rgba(15,23,42,0.08);
      --text: #0f172a;
      --muted: #667085;
      --shadow: 0 24px 54px rgba(15,23,42,0.1);
      --blue: #2563eb;
      --green: #15803d;
      --amber: #d97706;
      --red: #c2410c;
      --loop: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Display","Segoe UI",sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 34%),
        radial-gradient(circle at bottom right, rgba(15,118,110,0.1), transparent 28%),
        var(--bg);
    }
    .shell { max-width: 1240px; margin: 0 auto; padding: 28px 18px 40px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .back {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text);
      padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.72);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .hero { display: grid; gap: 18px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; }
    .metric { border: 1px solid var(--line); border-radius: 18px; background: white; padding: 18px; }
    .metric-label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .metric-value { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.04em; }
    .muted { color: var(--muted); }
    .timeline { display: grid; gap: 14px; margin-top: 22px; }
    .step {
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: white;
    }
    .step-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(15,23,42,0.02), rgba(255,255,255,0));
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .badge {
      display: inline-flex; padding: 6px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .done { background: rgba(34,197,94,0.12); color: var(--green); }
    .queued, .running { background: rgba(37,99,235,0.12); color: var(--blue); }
    .retry { background: rgba(217,119,6,0.12); color: var(--amber); }
    .failed { background: rgba(194,65,12,0.12); color: var(--red); }
    .loop_detected { background: rgba(124,58,237,0.12); color: var(--loop); }
    .step-body { padding: 18px; display: grid; gap: 14px; }
    .meta-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; color: var(--muted); font-size: 0.9rem; }
    .label { display: block; margin-bottom: 8px; font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; line-height: 1.65; }
    .loading, .empty {
      padding: 24px; border-radius: 22px; border: 1px dashed rgba(15,23,42,0.14); background: rgba(255,255,255,0.55); color: var(--muted);
    }
    @media (max-width: 860px) {
      .summary-grid, .meta-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .summary-grid, .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="back" href="/">← Back to dashboard</a>
      <div class="muted" id="loadingState">Loading run…</div>
    </div>

    <div id="content" class="loading">Loading timeline…</div>
  </div>

  <script>
    const contentEl = document.getElementById("content");
    const loadingEl = document.getElementById("loadingState");
    const runId = window.location.pathname.split("/").pop();

    function formatCurrency(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 4,
        maximumFractionDigits: 6
      }).format(Number(value || 0));
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderRun(payload) {
      const { run, steps, analytics } = payload;
      loadingEl.textContent = `Run #${run.id}`;

      const stepMarkup = steps.length
        ? steps.map((step, index) => `
            <article class="step">
              <div class="step-head">
                <div class="row">
                  <strong>${index + 1}. ${escapeHtml(step.step_name)}</strong>
                  <span class="badge ${step.status}">${step.status}</span>
                </div>
              </div>
              <div class="step-body">
                <div class="meta-grid">
                  <span>Cost: ${formatCurrency(step.cost)}</span>
                  <span>Retries: ${step.retry_count}</span>
                  <span>${new Date(step.created_at).toLocaleString()}</span>
                </div>
                <div>
                  <span class="label">Output</span>
                  <pre>${escapeHtml(step.output)}</pre>
                </div>
              </div>
            </article>
          `).join("")
        : '<div class="empty">No steps have been recorded yet.</div>';

      contentEl.className = "panel";
      contentEl.innerHTML = `
        <section class="hero">
          <div>
            <div class="muted" style="text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem;">Run #${run.id}</div>
            <h1 style="margin: 10px 0 8px; font-size: clamp(2rem,4vw,3.2rem); letter-spacing: -0.05em;">${escapeHtml(run.input)}</h1>
            <div class="muted">Status: <span class="badge ${run.status}">${run.status}</span></div>
          </div>

          <div class="summary-grid">
            <div class="metric"><div class="metric-label">Total Steps</div><div class="metric-value">${analytics.total_steps}</div></div>
            <div class="metric"><div class="metric-label">Total Retries</div><div class="metric-value">${run.total_retries}</div></div>
            <div class="metric"><div class="metric-label">Total Cost</div><div class="metric-value">${formatCurrency(analytics.total_cost)}</div></div>
            <div class="metric"><div class="metric-label">Execution Time</div><div class="metric-value">${run.execution_time_ms}ms</div></div>
          </div>

          <div class="meta-grid">
            <span>Failed steps: ${analytics.failed_steps}</span>
            <span>Loop events: ${analytics.loop_count}</span>
            <span>Created: ${new Date(run.created_at).toLocaleString()}</span>
          </div>

          <div class="timeline">${stepMarkup}</div>
        </section>
      `;
    }

    async function loadRun() {
      try {
        const res = await fetch(`/runs/${runId}`);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Failed to load run");
        }
        renderRun(data);
      } catch (error) {
        contentEl.className = "empty";
        contentEl.textContent = error.message || "Failed to load run.";
        loadingEl.textContent = "Unavailable";
      }
    }

    loadRun();
  </script>
</body>
</html>
